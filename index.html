
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Results Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container py-5">

        <h1 class="text-center mb-4">
            نظام إدارة نتائج الطلاب
        </h1>

        <div class="card p-4 shadow">

            <h3 class="mb-3">إضافة طالب جديد</h3>

            <div class="mb-3">
                <label class="form-label">اسم الطالب</label>
                <input type="text" id="studentName" class="form-control"
                    placeholder="أدخل اسم الطالب">
            </div>

            <div class="mb-3">
                <label class="form-label">درجة المادة الأولى</label>
                <input type="number" id="grade1" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">درجة المادة الثانية</label>
                <input type="number" id="grade2" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">درجة المادة الثالثة</label>
                <input type="number" id="grade3" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">نسبة الحضور</label>
                <input type="number" id="attendance" class="form-control">
            </div>

            <button id="addStudentBtn" class="btn btn-primary w-100 mb-3">
                إضافة طالب
            </button>

            <button id="mercyBtn" class="btn btn-success w-100">
                تفعيل لجنة الرأفة
            </button>

        </div>

        <!-- Error Messages -->
        <div id="errorBox" class="mt-3 text-danger"></div>

        <!-- Students List -->
        <div class="card p-3 mt-4 shadow">
            <h3>قائمة الطلاب</h3>
            <div id="studentsList"></div>
        </div>

        <!-- Mercy Report -->
        <div class="card p-3 mt-4 shadow">
            <h3>التقرير النهائي للجنة الرأفة</h3>
            <div id="reportBox"></div>
        </div>

    </div>

    <!-- JavaScript -->
    <script src="js/main.js"></script>

</body>
</html>
